<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fetch-ics — iCal Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .field-group + .field-group {
      margin-top: 18px;
    }

    input[type="url"], input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e6edf3;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus, input[type="text"]:focus {
      border-color: #58a6ff;
    }

    input[type="url"]::placeholder, input[type="text"]::placeholder {
      color: #484f58;
    }

    button {
      background: #238636;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    button:hover { background: #2ea043; }
    button:disabled { background: #1a4a25; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .message.show { display: block; }
    .message.error { background: #3d1f1f; border: 1px solid #f85149; color: #ff7b72; }
    .message.success { background: #1f3d1f; border: 1px solid #3fb950; color: #3fb950; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff4;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
      color: #484f58;
      text-align: center;
    }

    .footer a { color: #58a6ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">📅</div>
  <h1>fetch-ics</h1>
  <p class="subtitle">
    Paste any iCal (`.ics`) subscription URL — it downloads and saves the calendar file to your computer.
  </p>

  <div class="field-group">
    <label for="url">iCal URL</label>
    <div class="input-row">
      <input
        type="url"
        id="url"
        placeholder="https://example.com/calendar.ics"
        autofocus
        spellcheck="false"
      />
    </div>
  </div>

  <div class="field-group">
    <label for="filename">Save as</label>
    <div class="input-row">
      <input
        type="text"
        id="filename"
        placeholder="calendar.ics"
        spellcheck="false"
        autocomplete="off"
      />
      <button id="downloadBtn" onclick="downloadIcs()">Download</button>
    </div>
  </div>

  <div id="message" class="message"></div>

  <div class="footer">
    Open source —
    <a href="https://github.com/stoner19/fetch-ics" target="_blank" rel="noopener">
      view on GitHub
    </a>
  </div>
</div>

<script>
  // Ordered fetch strategies. "direct" works for feeds that already send
  // CORS headers; the rest are free, no-auth proxies used as fallbacks.
  const STRATEGIES = [
    {
      name: 'direct',
      build: u => ({ url: u }),
    },
    {
      name: 'allorigins',
      build: u => ({ url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) }),
    },
    {
      // Returns the page body wrapped in <html><body>…</body></html> but,
      // unlike its text mode, keeps line breaks intact — required for iCal.
      name: 'jina',
      build: u => ({ url: 'https://r.jina.ai/' + u, headers: { 'X-Return-Format': 'html' } }),
    },
    {
      name: 'allorigins-json',
      build: u => ({ url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(u), json: true }),
    },
  ];

  // Free proxies return sporadic 408/5xx even when the target is healthy,
  // so every strategy gets several passes before giving up.
  const ROUNDS = 3;
  const TIMEOUT_MS = 20000;

  const urlInput  = document.getElementById('url');
  const nameInput = document.getElementById('filename');
  const btn       = document.getElementById('downloadBtn');
  const msgEl     = document.getElementById('message');

  // Once the user types their own filename, stop overwriting it from the URL.
  let nameEdited = false;

  for (const el of [urlInput, nameInput]) {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') downloadIcs();
    });
  }

  urlInput.addEventListener('input', syncFilename);

  nameInput.addEventListener('input', () => {
    nameEdited = nameInput.value.trim() !== '';
    if (!nameEdited) syncFilename();
  });

  function syncFilename() {
    if (nameEdited) return;
    let suggestion = '';
    try {
      suggestion = deriveFilename(normalizeUrl(urlInput.value));
    } catch (_) { /* incomplete or invalid URL — leave the field empty */ }
    nameInput.value = suggestion;
  }

  function show(msg, type) {
    if (!msg) { msgEl.className = 'message'; msgEl.textContent = ''; return; }
    msgEl.textContent = msg;
    msgEl.className = 'message show ' + type;
  }

  function setLoading(on, label) {
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>' + (label || 'Fetching…')
      : 'Download';
  }

  function timeoutSignal(ms) {
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
      return AbortSignal.timeout(ms);
    }
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), ms);
    return ctrl.signal;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function normalizeUrl(raw) {
    let url = raw.trim();
    // Subscription links are commonly handed out as webcal://
    if (/^webcal:\/\//i.test(url)) url = 'https://' + url.slice('webcal://'.length);
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const parsed = new URL(url); // throws on malformed input
    // new URL() happily accepts things like "https://not a url"
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(parsed.hostname)) {
      throw new Error('invalid hostname');
    }
    return url;
  }

  // Pull the calendar out of whatever wrapper a proxy added around it.
  function extractCalendar(text) {
    const start = text.indexOf('BEGIN:VCALENDAR');
    if (start === -1) return null;
    const endTag = 'END:VCALENDAR';
    const end = text.lastIndexOf(endTag);
    if (end === -1 || end < start) return null;
    return text.slice(start, end + endTag.length).trim() + '\r\n';
  }

  async function attempt(strategy, url) {
    const { url: target, headers, json } = strategy.build(url);
    const resp = await fetch(target, {
      headers: headers || {},
      signal: timeoutSignal(TIMEOUT_MS),
    });
    if (!resp.ok) throw new Error(`${strategy.name}: HTTP ${resp.status}`);

    let body = await resp.text();
    if (json) {
      const parsed = JSON.parse(body);
      body = parsed.contents || '';
    }

    const ics = extractCalendar(body);
    // A 200 carrying an error page is a proxy failure, not a bad calendar —
    // keep trying instead of surfacing it as a fatal result.
    if (!ics) throw new Error(`${strategy.name}: response was not an iCal feed`);
    return ics;
  }

  function sanitizeFilename(name) {
    let stem = name.trim().replace(/\.ics$/i, '');
    stem = stem.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').replace(/^\.+/, '').trim();
    return (stem || 'calendar') + '.ics';
  }

  function deriveFilename(url) {
    try {
      const u = new URL(url);
      let stem = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '');
      if (!stem.trim()) stem = u.hostname.replace(/^www\./, '');
      return sanitizeFilename(stem);
    } catch (_) {
      return 'calendar.ics';
    }
  }

  async function downloadIcs() {
    const raw = urlInput.value.trim();
    if (!raw) { show('Please enter a URL.', 'error'); return; }

    let url;
    try {
      url = normalizeUrl(raw);
    } catch (_) {
      show('✗ That doesn\u2019t look like a valid URL.', 'error');
      return;
    }

    setLoading(true);
    show('', '');

    let ics = null;
    const errors = [];

    outer:
    for (let round = 0; round < ROUNDS; round++) {
      for (const strategy of STRATEGIES) {
        setLoading(true, round === 0 ? 'Fetching…' : `Retrying (${round + 1}/${ROUNDS})…`);
        try {
          ics = await attempt(strategy, url);
          break outer;
        } catch (err) {
          errors.push(err.name === 'TimeoutError' || err.name === 'AbortError'
            ? `${strategy.name}: timed out`
            : err.message);
        }
      }
      if (round < ROUNDS - 1) await sleep(800 * (round + 1));
    }

    try {
      if (!ics) {
        throw new Error(
          'Could not fetch the calendar. Last error \u2014 ' + errors[errors.length - 1]
        );
      }

      const filename = nameInput.value.trim()
        ? sanitizeFilename(nameInput.value)
        : deriveFilename(url);
      nameInput.value = filename;

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);

      show('✓ Downloaded ' + filename, 'success');
    } catch (err) {
      show('✗ ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }
</script>

</body>
</html>
