<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fetch-ics — iCal Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="url"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e6edf3;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #58a6ff;
    }

    input[type="url"]::placeholder {
      color: #484f58;
    }

    button {
      background: #238636;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    button:hover { background: #2ea043; }
    button:disabled { background: #1a4a25; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .message.show { display: block; }
    .message.error { background: #3d1f1f; border: 1px solid #f85149; color: #ff7b72; }
    .message.success { background: #1f3d1f; border: 1px solid #3fb950; color: #3fb950; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff4;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
      color: #484f58;
      text-align: center;
    }

    .footer a { color: #58a6ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">📅</div>
  <h1>fetch-ics</h1>
  <p class="subtitle">
    Paste any iCal (`.ics`) subscription URL — it downloads and saves the calendar file to your computer.
  </p>

  <label for="url">iCal URL</label>
  <div class="input-row">
    <input
      type="url"
      id="url"
      placeholder="https://example.com/calendar.ics"
      autofocus
      spellcheck="false"
    />
    <button id="downloadBtn" onclick="downloadIcs()">Download</button>
  </div>

  <div id="message" class="message"></div>

  <div class="footer">
    Open source —
    <a href="https://github.com/stoner19/fetch-ics" target="_blank" rel="noopener">
      view on GitHub
    </a>
  </div>
</div>

<script>
  // Free, no-auth CORS proxy
  const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

  const urlInput   = document.getElementById('url');
  const btn        = document.getElementById('downloadBtn');
  const msgEl      = document.getElementById('message');

  // Allow Enter key to trigger download
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') downloadIcs();
  });

  function show(msg, type) {
    msgEl.textContent = msg;
    msgEl.className = 'message show ' + type;
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Fetching…'
      : 'Download';
  }

  async function downloadIcs() {
    const url = urlInput.value.trim();
    if (!url) { show('Please enter a URL.', 'error'); return; }

    setLoading(true);
    show('', '');

    try {
      const resp = await fetch(CORS_PROXY + encodeURIComponent(url));
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const text = await resp.text();

      if (!text.includes('BEGIN:VCALENDAR')) {
        throw new Error("Doesn't look like a valid iCal file (missing BEGIN:VCALENDAR).");
      }

      // Derive a filename from the URL
      let filename = 'calendar.ics';
      try {
        const u = new URL(url);
        const stem = u.pathname.split('/').pop();
        if (stem && stem !== url) {
          filename = stem.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_') + '.ics';
          if (!filename.endsWith('.ics')) filename += '.ics';
        }
      } catch (_) { /* use default */ }

      // Trigger download
      const blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);

      show('✓ Downloaded ' + filename, 'success');

    } catch (err) {
      show('✗ ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }
</script>

</body>
</html>
